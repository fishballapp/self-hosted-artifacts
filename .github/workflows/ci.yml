name: CI

# Every gate, on every branch. The private monorepo this tree is ejected from pushes each of its
# pull requests to the branch pr/<number> here, so these run before the private merge; cd.yml calls
# this workflow again on main before it publishes.
on:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer snapshot of a branch supersedes the one under test; main queues behind cd.yml's publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      # The runner runs the action on Node 24, so its tests do too.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: echo "ACTION_NODE=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm repojj:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node packages/self-hosted-artifacts/dist/bin.js --version
      # The eject builds this file on another machine, and a release tag finds its commit by tree.
      - run: git diff --exit-code -- upload/dist
