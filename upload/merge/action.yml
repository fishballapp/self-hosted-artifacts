name: Self-hosted artifacts merge
description: Merge a run's artifacts on your own artifact server or in your own bucket into one, as actions/upload-artifact/merge does on GitHub.
inputs:
  server-url:
    description: Base URL of the server, as the runner reaches it. Exactly one of this and `s3-bucket` is required.
  s3-bucket:
    description: The bucket to use rather than a server, with credentials in AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN. Exactly one of this and `server-url` is required.
  s3-region:
    description: The bucket's region. Defaults to AWS_REGION. On R2, `auto`.
  s3-endpoint:
    description: The endpoint of an S3-compatible store, such as R2 or MinIO. Without it, the bucket is on AWS.
  s3-link-base:
    description: What links start with, as `<s3-link-base>/artifacts/<id>/<name>`. Required with `s3-bucket`.
  name:
    description: The name of the artifact that the artifacts will be merged into, stored as `<name>.zip`.
    default: merged-artifacts
  pattern:
    description: A glob pattern matching the artifact names that should be merged.
    default: '*'
  separate-directories:
    description: >
      When multiple artifacts are matched, this changes the behavior of how they are merged in the
      archive. If true, the matched artifacts will be extracted into individual named directories
      within the specified path. If false, the matched artifacts will combined in the same directory.
    default: 'false'
  retention-days:
    description: Days to keep the merged artifact. 0 means the default, the server's or 90 with a bucket; a larger number is capped.
    default: '0'
  compression-level:
    description: >
      The level of compression for Zlib to be applied to the merged archive, from 0 (none) to 9
      (best). For large files that are not easily compressed, 0 is significantly faster.
    default: '6'
  delete-merged:
    description: >
      If true, the artifacts that were merged will be deleted, once the merged artifact is stored.
      If false, the artifacts will still exist.
    default: 'false'
  include-hidden-files:
    description: >
      If true, hidden files will be included in the merged artifact. If false, hidden files will be
      excluded from the merged artifact.
    default: 'false'
  audience:
    description: With `server-url`, the OIDC audience to request, matching the server's oidcAudience.
    default: self-hosted-artifacts
outputs:
  artifact-id:
    description: The merged artifact's ID, which is also its download token.
  artifact-url:
    description: The first download link of the merged artifact.
  artifact-digest:
    description: The SHA-256 of the merged artifact's zip, in hex.
  links:
    description: Every download link, by label, as one-line JSON.
  expires-at:
    description: When the merged artifact expires, as an ISO instant.
runs:
  using: node24
  main: dist/action.mjs
