name: Self-hosted artifacts upload
description: Upload files from a workflow to your own artifact server or bucket, as actions/upload-artifact does to GitHub.
inputs:
  server-url:
    description: Base URL of the server, as the runner reaches it. Exactly one of this and `s3-bucket` is required.
  s3-bucket:
    description: The bucket to use rather than a server, with credentials in AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN. Exactly one of this and `server-url` is required.
  s3-region:
    description: The bucket's region. Defaults to AWS_REGION. On R2, `auto`.
  s3-endpoint:
    description: The endpoint of an S3-compatible store, such as R2 or MinIO. Without it, the bucket is on AWS.
  s3-link-base:
    description: What links start with, as `<s3-link-base>/artifacts/<id>/<name>`. Required with `s3-bucket`.
  path:
    description: A file, directory or wildcard pattern that describes what to upload. Several lines add to it, and a line starting with `!` excludes.
    required: true
  name:
    description: Artifact name, stored as `<name>.zip`. If the `archive` input is `false`, the name of the file uploaded is used instead.
    default: artifact
  if-no-files-found:
    description: >
      The desired behavior if no files are found using the provided path.

      Available Options:
        warn: Output a warning but do not fail the action
        error: Fail the action with an error message
        ignore: Do not output any warnings or errors, the action does not fail
    default: warn
  retention-days:
    description: Days to keep the file. 0 means the default, the server's or 90 with a bucket; a larger number is capped.
    default: '0'
  compression-level:
    description: >
      The level of compression for Zlib to be applied to the archive, from 0 (none) to 9 (best). For
      large files that are not easily compressed, 0 is significantly faster.
    default: '6'
  include-hidden-files:
    description: If true, files and folders starting with `.` are included.
    default: 'false'
  archive:
    description: >
      If true, the files are zipped before uploading. If false, one file is uploaded as it is, under
      its own name, ignoring the `name` input.
    default: 'true'
  overwrite:
    description: >
      If true, an artifact of this name in the same run attempt is replaced, and its link stops
      working. If false, uploading a name that attempt already holds fails, unless the content is
      the same.
    default: 'false'
  audience:
    description: With `server-url`, the OIDC audience to request, matching the server's oidcAudience.
    default: self-hosted-artifacts
outputs:
  artifact-id:
    description: The artifact's ID, which is also its download token. Empty if nothing was uploaded.
  artifact-url:
    description: The first download link. Empty if nothing was uploaded.
  artifact-digest:
    description: The SHA-256 of what was uploaded, in hex. Empty if nothing was uploaded.
  links:
    description: Every download link, by label, as one-line JSON. Empty if nothing was uploaded.
  expires-at:
    description: When the file expires, as an ISO instant. Empty if nothing was uploaded.
runs:
  using: node24
  main: dist/action.mjs
